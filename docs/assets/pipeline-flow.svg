<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 190" width="100%" height="190">
  <rect width="960" height="190" rx="14" fill="#0B111E" stroke="#1E293B" stroke-width="2" />

  <!-- Connecting Lines -->
  <line x1="220" y1="95" x2="270" y2="95" stroke="#334155" stroke-width="2.5" />
  <line x1="460" y1="95" x2="510" y2="95" stroke="#334155" stroke-width="2.5" />
  <line x1="700" y1="95" x2="750" y2="95" stroke="#334155" stroke-width="2.5" />

  <!-- Animated Signal Pulses -->
  <circle cx="220" cy="95" r="5" fill="#38BDF8">
    <animate attributeName="cx" values="220;270" dur="1.4s" repeatCount="indefinite" />
  </circle>
  <circle cx="460" cy="95" r="5" fill="#10B981">
    <animate attributeName="cx" values="460;510" dur="1.4s" begin="0.45s" repeatCount="indefinite" />
  </circle>
  <circle cx="700" cy="95" r="5" fill="#F59E0B">
    <animate attributeName="cx" values="700;750" dur="1.4s" begin="0.9s" repeatCount="indefinite" />
  </circle>

  <!-- Step 1 -->
  <rect x="30" y="42" width="190" height="106" rx="10" fill="#111A2B" stroke="#38BDF8" stroke-width="1.5" />
  <text x="125" y="72" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#38BDF8">01 • CAPTURE</text>
  <text x="125" y="98" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Audition Vidéo</text>
  <text x="125" y="122" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#94A3B8">React + API DRF</text>

  <!-- Step 2 -->
  <rect x="270" y="42" width="190" height="106" rx="10" fill="#111A2B" stroke="#64748B" stroke-width="1.5" />
  <text x="365" y="72" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">02 • FILE ASYNC</text>
  <text x="365" y="98" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Broker & Workers</text>
  <text x="365" y="122" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#94A3B8">Redis + Celery</text>

  <!-- Step 3 -->
  <rect x="510" y="42" width="190" height="106" rx="10" fill="#111A2B" stroke="#10B981" stroke-width="1.5" />
  <text x="605" y="72" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#10B981">03 • EXTRACTION IA</text>
  <text x="605" y="98" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Analyse Multimodale</text>
  <text x="605" y="122" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#94A3B8">MediaPipe • DeepFace • Librosa</text>

  <!-- Step 4 -->
  <rect x="750" y="42" width="180" height="106" rx="10" fill="#111A2B" stroke="#F59E0B" stroke-width="1.5" />
  <text x="840" y="72" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#FBBF24">04 • DÉCISION XAI</text>
  <text x="840" y="98" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Top 15 & Radar</text>
  <text x="840" y="122" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#94A3B8">Validation Jury Humain</text>
</svg>
