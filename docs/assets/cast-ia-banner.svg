 <radialGradient id="glow"><stop stop-color="#38bdf8" stop-opacity=".32"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<circle cx="930" cy="165" r="290" fill="url(#glow)"/>
