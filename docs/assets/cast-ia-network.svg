<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
<title id="title">Réseau de casting Cast IA</title>
<desc id="desc">Animation stylisée des connexions entre le scénario, les candidatures, l'évaluation manuelle et la décision humaine.</desc>
<defs><linearGradient id="line" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#f4bd59"/></linearGradient></defs>
<rect width="760" height="360" rx="24" fill="#08152c"/>
<g stroke="url(#line)" stroke-width="2" fill="none" opacity=".75">
<path d="M380 180L170 85M380 180L590 85M380 180L170 275M380 180L590 275"/>
<path d="M170 85L590 85M170 275L590 275" stroke-dasharray="6 8"/>
</g>
<g fill="#132e54" stroke="#54c8ff" stroke-width="2">
<rect x="285" y="135" width="190" height="90" rx="18"/>
<rect x="90" y="48" width="160" height="74" rx="15"/><rect x="510" y="48" width="160" height="74" rx="15"/>
<rect x="90" y="238" width="160" height="74" rx="15"/><rect x="510" y="238" width="160" height="74" rx="15"/>
</g>
<g fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
<text x="380" y="174" font-size="18" font-weight="700">CAST IA</text><text x="380" y="199" font-size="13" fill="#cbd5e1">Aide à la présélection</text>
<text x="170" y="91" font-size="15">Scénario / rôle</text><text x="590" y="91" font-size="15">Candidatures</text>
<text x="170" y="281" font-size="15">Évaluation</text><text x="590" y="281" font-size="15">Décision humaine</text>
</g>
<g fill="#f4bd59">
<circle r="6"><animateMotion dur="3.2s" repeatCount="indefinite" path="M380 180L170 85"/></circle>
<circle r="6"><animateMotion dur="3.2s" begin=".8s" repeatCount="indefinite" path="M380 180L590 85"/></circle>
<circle r="6"><animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite" path="M380 180L170 275"/></circle>
<circle r="6"><animateMotion dur="3.2s" begin="2.4s" repeatCount="indefinite" path="M380 180L590 275"/></circle>
</g>
</svg>