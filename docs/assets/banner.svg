<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B14" />
      <stop offset="55%" stop-color="#121629" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)" />
  <rect x="1" y="1" width="1198" height="298" rx="15" fill="none" stroke="#232842" stroke-width="2" />

  <!-- Subtle background orbit rings -->
  <circle cx="960" cy="150" r="115" fill="none" stroke="#312E81" stroke-width="1.5" stroke-dasharray="6 6">
    <animateTransform attributeName="transform" type="rotate" from="0 960 150" to="360 960 150" dur="30s" repeatCount="indefinite" />
  </circle>
  <circle cx="960" cy="150" r="80" fill="none" stroke="#F59E0B" stroke-opacity="0.28" stroke-width="1.5" />

  <!-- Animated Audio / Prosody Wave Bars -->
  <g transform="translate(885, 150)">
    <rect x="0" y="-25" width="8" height="50" rx="4" fill="#818CF8">
      <animate attributeName="height" values="20;70;30;60;20" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="y" values="-10;-35;-15;-30;-10" dur="1.8s" repeatCount="indefinite" />
    </rect>
    <rect x="20" y="-40" width="8" height="80" rx="4" fill="#A78BFA">
      <animate attributeName="height" values="75;25;85;35;75" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="y" values="-37;-12;-42;-17;-37" dur="1.5s" repeatCount="indefinite" />
    </rect>
    <rect x="40" y="-30" width="8" height="60" rx="4" fill="#F59E0B">
      <animate attributeName="height" values="35;90;40;80;35" dur="2.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="-17;-45;-20;-40;-17" dur="2.1s" repeatCount="indefinite" />
    </rect>
    <rect x="60" y="-45" width="8" height="90" rx="4" fill="#FBBF24">
      <animate attributeName="height" values="85;30;75;25;85" dur="1.7s" repeatCount="indefinite" />
      <animate attributeName="y" values="-42;-15;-37;-12;-42" dur="1.7s" repeatCount="indefinite" />
    </rect>
    <rect x="80" y="-25" width="8" height="50" rx="4" fill="#818CF8">
      <animate attributeName="height" values="25;65;20;70;25" dur="1.9s" repeatCount="indefinite" />
      <animate attributeName="y" values="-12;-32;-10;-35;-12" dur="1.9s" repeatCount="indefinite" />
    </rect>
    <rect x="100" y="-35" width="8" height="70" rx="4" fill="#F59E0B">
      <animate attributeName="height" values="60;20;75;30;60" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="y" values="-30;-10;-37;-15;-30" dur="1.6s" repeatCount="indefinite" />
    </rect>
    <rect x="120" y="-20" width="8" height="40" rx="4" fill="#A78BFA">
      <animate attributeName="height" values="30;60;25;50;30" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="y" values="-15;-30;-12;-25;-15" dur="2.2s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Top Pill Badge -->
  <rect x="64" y="48" width="380" height="32" rx="16" fill="#1E1B4B" stroke="#F59E0B" stroke-width="1" />
  <circle cx="84" cy="64" r="5" fill="#FBBF24">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="100" y="69" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#FDE68A" letter-spacing="0.8">IA ÉTHIQUE 360 • JEI INSAT × OIF</text>

  <!-- Main Title -->
  <text x="64" y="148" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#F8FAFC" letter-spacing="-1">CAST <tspan fill="url(#accent)">AI</tspan></text>

  <!-- Subtitle -->
  <text x="64" y="192" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#CBD5E1">Présélection artistique multimodale — objective, explicable et inclusive.</text>

  <!-- Tech Footer Line -->
  <text x="64" y="242" font-family="Consolas, Monaco, monospace" font-size="14" fill="#94A3B8">Django 5.2  •  React + Vite  •  Celery & Redis  •  MediaPipe • DeepFace • Librosa</text>
</svg>
